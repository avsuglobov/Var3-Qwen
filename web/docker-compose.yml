# Этап 19: контур деплоя. Запуск из каталога web/: docker compose up -d --build.
# Приложение слушает только 127.0.0.1 — наружу публикуется nginx на 80/443 (см. инструкцию развёртывания).
services:
  app:
    build: .
    image: aiws-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # панель сбоев /api/debug в проде выключена (этап 19); локально для отладки задайте "1"
      AIWS_DEBUG: ""
      # SQLite — рабочий драйвер прод-контура (этап 17); "file" только для dev/e2e
      AIWS_DB_DRIVER: sqlite
    volumes:
      # всё изменяемое состояние: база .data/db.sqlite3 (+WAL), secrets.json с ключами и учётными записями, журнал интеграций
      - ./.data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
